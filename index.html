<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Mentor</title>

    <style>
        body{
            margin:0;
            background:#0b4f2c;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh; /* Use min-height instead of height for better responsiveness */
            padding: 20px; /* Add some padding for overall spacing */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }

        .card{
            background:#145a32;
            padding:40px;
            border-radius:20px;
            text-align:center;
            max-width:400px; /* Increased max-width for game elements */
            width:90%; /* Cardul va ocupa 90% din lățimea viewport-ului pe ecrane mici */
            box-shadow:0 0 20px rgba(0,0,0,.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Media query pentru ecrane mai mici (ex: telefoane mobile) */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 20px; /* Reducem padding-ul pe ecrane mici */
            }
            h1 {
                font-size: 2em; /* Ajustăm dimensiunea titlului */
            }
            button {
                font-size: 16px; /* Ajustăm dimensiunea textului butonului */
                padding: 12px 20px;
            }
            .betting-controls button, .betting-controls input {
                width: 100%;
                margin-top: 10px;
            }
            .game-info {
                flex-direction: column;
                gap: 5px;
            }
            .main-controls button {
                width: 100%;
            }
            .challenge-item {
                flex-direction: column;
            }
            .challenge-item .reward-claim {
                margin-top: 10px;
            }
            .leaderboard-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        h1{
            margin-top:0;
        }

        button{
            background:#f1c40f;
            color:black;
            border:none;
            padding:15px 25px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
            transition: transform 0.2s; /* Adăugat pentru o animație mai fină la hover */
        }

        button:hover{
            transform:scale(1.05);
        }

        .main-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .game-area,
        .profile-area,
        .daily-training-area,
        .challenges-area,
        .leaderboards-area { /* Add leaderboards-area here */
            margin-top: 20px;
            display: none; /* Ascuns inițial, va fi afișat cu JavaScript */
            width: 100%; /* Make game area take full width of parent */
        }

        .profile-area,
        .challenges-area,
        .leaderboards-area {
            background: #1a603c; /* Slightly different background for profile and challenges */
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }

        .profile-area h2,
        .daily-training-area h2,
        .challenges-area h2,
        .leaderboards-area h2 { /* Style for leaderboards title */
            text-align: center;
            margin-top: 0;
            color: #f1c40f;
        }

        .profile-area p,
        .daily-training-area p {
            font-size: 1.1em;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .challenges-area ul,
        .leaderboards-area ul {
            list-style: none;
            padding: 0;
        }

        .challenges-area ul li,
        .leaderboards-area ul li {
            background: #0d3b20;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .leaderboard-item {
            font-size: 1.1em;
            font-weight: bold;
        }

        .challenge-item-details {
            text-align: left;
            flex-grow: 1;
        }

        .challenge-item-details h4 {
            margin: 0 0 5px 0;
            color: #f1c40f;
        }

        .challenge-item-details p {
            margin: 0;
            font-size: 0.9em;
            color: #ccc;
        }

        .challenge-item .reward-claim {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .challenge-item .reward-claim button {
            padding: 8px 15px;
            font-size: 0.9em;
            margin-top: 0;
        }

        .challenge-item .status {
            font-style: italic;
            color: #aaa;
            font-size: 0.9em;
        }

        .profile-area button,
        .daily-training-area button,
        .challenges-area button,
        .leaderboards-area button { /* Style for leaderboards button */
            margin-top: 20px;
            width: 100%;
        }

        .daily-training-area {
            background: #2a6a4c; /* Different shade for distinction */
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
            background: #0d3b20; /* Darker background for info */
            padding: 10px;
            border-radius: 8px;
        }

        .player-hand, .community-cards {
            margin-bottom: 20px;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap; /* Allow cards to wrap on smaller screens */
        }

        .card-placeholder {
            width: 60px;
            height: 90px;
            background-color: #333;
            border-radius: 5px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em; /* Reduced font size for better fit */
            font-weight: bold;
            color: #eee;
            flex-shrink: 0; /* Prevent cards from shrinking */
        }

        /* Style for actual cards once they are displayed */
        .card-placeholder.actual-card {
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            font-size: 1.5em;
            padding: 5px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .card-placeholder.actual-card .rank {
            font-size: 1em;
            line-height: 1;
        }

        .card-placeholder.actual-card .suit {
            font-size: 1.2em;
            line-height: 1;
        }
        
        .card-placeholder.actual-card.red {
            color: red;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .betting-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .betting-controls input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            width: 100px; /* Adjust as needed */
            text-align: center;
            -moz-appearance: textfield; /* Hide arrows in Firefox */
        }
        .betting-controls input[type="number"]::-webkit-outer-spin-button,
        .betting-controls input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; /* Hide arrows in Chrome, Safari, Edge */
            margin: 0;
        }

        .betting-controls button {
            padding: 10px 20px;
            font-size: 1em;
        }

    </style>

</head>

<body>

<div class="card">

<h1>🃏 Poker Mentor</h1>

<p>Become a better poker player.</p>

<div class="main-controls">
    <button id="startTrainingBtn">Start Training</button>
    <button id="viewProfileBtn">View Profile</button>
    <button id="dailyTrainingBtn">Antrenamente Zilnice</button>
    <button id="viewChallengesBtn">Provocări</button>
    <button id="viewLeaderboardsBtn">Clasamente</button> <!-- NEW BUTTON -->
</div>

<div class="game-area">
    <div id="gameInfo" class="game-info">
        <span id="playerChips">Your Chips: $1000</span>
        <span id="pot">Pot: $0</span>
        <span id="playerLevelXP">Level: 1 (0/100 XP)</span> <!-- New element for Level and XP -->
    </div>

    <div class="player-hand">
        <h3>Your Hand</h3>
        <div class="cards-container" id="playerHandCards">
            <div class="card-placeholder"></div>
            <div class="card-placeholder"></div>
        </div>
    </div>

    <div class="community-cards">
        <h3>Community Cards</h3>
        <div class="cards-container" id="communityCards">
            <!-- Placeholders for community cards will be filled by JS -->
        </div>
    </div>

    <div class="controls">
        <button id="dealBtn">Deal Flop</button>
        <button id="foldBtn">Fold</button>
        <button id="checkBtn">Check</button>
        <button id="callBtn" style="display: none;">Call</button>
        <button id="raiseBtn" style="display: none;">Raise</button>
        <button id="resetBtn" style="display: none;">Reset Game</button>
    </div>

    <div id="bettingControls" class="betting-controls" style="display: none;">
        <input type="number" id="betAmount" min="1" value="0">
        <button id="placeBetBtn">Bet</button>
    </div>

</div>

<div id="profileArea" class="profile-area">
    <h2>Player Profile</h2>
    <p>Level: <span id="profileLevel">1</span></p>
    <p>Current XP: <span id="profileXP">0</span></p>
    <p>XP to next Level: <span id="profileNextLevelXP">100</span></p>
    <button id="backToGameBtn">Back to Main Menu</button>
</div>

<div id="dailyTrainingArea" class="daily-training-area">
    <h2>Antrenamente Zilnice</h2>
    <p>Completează antrenamentul zilnic pentru a câștiga 50 XP bonus!</p>
    <button id="startDailyTrainingBtn">Începe Antrenamentul</button>
    <p id="dailyTrainingStatus"></p>
    <button id="backToMainFromDailyTrainingBtn">Înapoi la Meniu</button>
</div>

<div id="challengesArea" class="challenges-area">
    <h2>Provocări</h2>
    <ul id="challengesList">
        <!-- Challenges will be dynamically loaded here by JS -->
    </ul>
    <button id="backToMainFromChallengesBtn">Înapoi la Meniu</button>
</div>

<div id="leaderboardsArea" class="leaderboards-area"> <!-- NEW LEADERBOARDS AREA -->
    <h2>Clasamente</h2>
    <ul id="leaderboardList">
        <!-- Leaderboard items will be dynamically loaded here by JS -->
    </ul>
    <button id="backToMainFromLeaderboardsBtn">Înapoi la Meniu</button>
</div>

<script>
    const startTrainingBtn = document.getElementById('startTrainingBtn');
    const viewProfileBtn = document.getElementById('viewProfileBtn');
    const dailyTrainingBtn = document.getElementById('dailyTrainingBtn');
    const viewChallengesBtn = document.getElementById('viewChallengesBtn');
    const viewLeaderboardsBtn = document.getElementById('viewLeaderboardsBtn'); // NEW

    const backToGameBtn = document.getElementById('backToGameBtn');
    const startDailyTrainingBtn = document.getElementById('startDailyTrainingBtn');
    const dailyTrainingStatus = document.getElementById('dailyTrainingStatus');
    const backToMainFromDailyTrainingBtn = document.getElementById('backToMainFromDailyTrainingBtn');
    const backToMainFromChallengesBtn = document.getElementById('backToMainFromChallengesBtn');
    const backToMainFromLeaderboardsBtn = document.getElementById('backToMainFromLeaderboardsBtn'); // NEW

    const mainControls = document.querySelector('.main-controls');
    const gameArea = document.querySelector('.game-area');
    const profileArea = document.getElementById('profileArea');
    const dailyTrainingArea = document.getElementById('dailyTrainingArea');
    const challengesArea = document.getElementById('challengesArea');
    const leaderboardsArea = document.getElementById('leaderboardsArea'); // NEW
    const leaderboardList = document.getElementById('leaderboardList'); // NEW
    const challengesList = document.getElementById('challengesList');

    const playerChipsSpan = document.getElementById('playerChips');
    const potSpan = document.getElementById('pot');
    const playerLevelXPSpan = document.getElementById('playerLevelXP');
    const profileLevel = document.getElementById('profileLevel');
    const profileXP = document.getElementById('profileXP');
    const profileNextLevelXP = document.getElementById('profileNextLevelXP');

    const playerHandCardsDiv = document.getElementById('playerHandCards');
    const communityCardsDiv = document.getElementById('communityCards');
    const dealBtn = document.getElementById('dealBtn');
    const foldBtn = document.getElementById('foldBtn');
    const checkBtn = document.getElementById('checkBtn');
    const callBtn = document.getElementById('callBtn');
    const raiseBtn = document.getElementById('raiseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const bettingControlsDiv = document.getElementById('bettingControls');
    const betAmountInput = document.getElementById('betAmount');
    const placeBetBtn = document.getElementById('placeBetBtn');


    const suits = ['♠', '♥', '♦', '♣'];
    const ranks = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
    let deck = [];
    let playerHand = [];
    let communityCards = [];
