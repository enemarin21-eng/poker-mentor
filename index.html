<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Mentor</title>

    <style>
        body{
            margin:0;
            background:#0b4f2c;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#145a32;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:350px;
            box-shadow:0 0 20px rgba(0,0,0,.4);
        }

        h1{
            margin-top:0;
        }

        button{background:#f1c40f;
            color:black;
            border:none;
            padding:15px 25px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            transform:scale(1.05);
        }
    </style>

</head>

<body>

<div class="card">

<h1>🃏 Poker Mentor</h1>

<p>Become a better poker player.</p>

<button>Start Training</button>

</div>

</body>
</html>
