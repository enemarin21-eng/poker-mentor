<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Mentor</title>

    <style>
        body{
            margin:0;
            background:#0b4f2c;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh; /* Use min-height instead of height for better responsiveness */
            padding: 20px; /* Add some padding for overall spacing */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }

        .card{
            background:#145a32;
            padding:40px;
            border-radius:20px;
            text-align:center;
            max-width:400px; /* Increased max-width for game elements */
            width:90%; /* Cardul va ocupa 90% din lățimea viewport-ului pe ecrane mici */
            box-shadow:0 0 20px rgba(0,0,0,.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Media query pentru ecrane mai mici (ex: telefoane mobile) */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 20px; /* Reducem padding-ul pe ecrane mici */
            }
            h1 {
                font-size: 2em; /* Ajustăm dimensiunea titlului */
            }
            button {
                font-size: 16px; /* Ajustăm dimensiunea textului butonului */
                padding: 12px 20px;
            }
            .betting-controls button, .betting-controls input {
                width: 100%;
                margin-top: 10px;
            }
            .game-info {
                flex-direction: column;
                gap: 5px;
            }
            .main-controls button {
                width: 100%;
            }
            .challenge-item {
                flex-direction: column;
            }
            .challenge-item .reward-claim {
                margin-top: 10px;
            }
            .leaderboard-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        h1{
            margin-top:0;
        }

        button{
            background:#f1c40f;
            color:black;
            border:none;
            padding:15px 25px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
            transition: transform 0.2s; /* Adăugat pentru o animație mai fină la hover */
        }

        button:hover{
            transform:scale(1.05);
        }

        .main-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .game-area,
        .profile-area,
        .daily-training-area,
        .challenges-area,
        .leaderboards-area { /* Add leaderboards-area here */
            margin-top: 20px;
            display: none; /* Ascuns inițial, va fi afișat cu JavaScript */
            width: 100%; /* Make game area take full width of parent */
        }

        .profile-area,
        .challenges-area,
        .leaderboards-area {
            background: #1a603c; /* Slightly different background for profile and challenges */
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }

        .profile-area h2,
        .daily-training-area h2,
        .challenges-area h2,
        .leaderboards-area h2 { /* Style for leaderboards title */
            text-align: center;
            margin-top: 0;
            color: #f1c40f;
        }

        .profile-area p,
        .daily-training-area p {
            font-size: 1.1em;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .challenges-area ul,
        .leaderboards-area ul {
            list-style: none;
            padding: 0;
        }

        .challenges-area ul li,
        .leaderboards-area ul li {
            background: #0d3b20;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .leaderboard-item {
            font-size: 1.1em;
            font-weight: bold;
        }

        .challenge-item-details {
            text-align: left;
            flex-grow: 1;
        }

        .challenge-item-details h4 {
            margin: 0 0 5px 0;
            color: #f1c40f;
        }

        .challenge-item-details p {
            margin: 0;
            font-size: 0.9em;
            color: #ccc;
        }

        .challenge-item .reward-claim {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .challenge-item .reward-claim button {
            padding: 8px 15px;
            font-size: 0.9em;
            margin-top: 0;
        }

        .challenge-item .status {
            font-style: italic;
            color: #aaa;
            font-size: 0.9em;
        }

        .profile-area button,
        .daily-training-area button,
        .challenges-area button,
        .leaderboards-area button { /* Style for leaderboards button */
            margin-top: 20px;
            width: 100%;
        }

        .daily-training-area {
            background: #2a6a4c; /* Different shade for distinction */
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
            background: #0d3b20; /* Darker background for info */
            padding: 10px;
            border-radius: 8px;
        }

        .player-hand, .community-cards {
            margin-bottom: 20px;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap; /* Allow cards to wrap on smaller screens */
        }

        .card-placeholder {
            width: 60px;
            height: 90px;
            background-color: #333;
            border-radius: 5px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em; /* Reduced font size for better fit */
            font-weight: bold;
            color: #eee;
            flex-shrink: 0; /* Prevent cards from shrinking */
        }

        /* Style for actual cards once they are displayed */
        .card-placeholder.actual-card {
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            font-size: 1.5em;
            padding: 5px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .card-placeholder.actual-card .rank {
            font-size: 1em;
            line-height: 1;
        }

        .card-placeholder.actual-card .suit {
            font-size: 1.2em;
            line-height: 1;
        }
        
        .card-placeholder.actual-card.red {
            color: red;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .betting-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .betting-controls input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            width: 100px; /* Adjust as needed */
            text-align: center;
            -moz-appearance: textfield; /* Hide arrows in Firefox */
        }
        .betting-controls input[type="number"]::-webkit-outer-spin-button,
        .betting-controls input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; /* Hide arrows in Chrome, Safari, Edge */
            margin: 0;
        }

        .betting-controls button {
            padding: 10px 20px;
            font-size: 1em;
        }

    </style>

</head>

<body>

<div class="card">

<h1>🃏 Poker Mentor</h1>

<p>Become a better poker player.</p>

<div class="main-controls">
    <button id="startTrainingBtn">Start Training</button>
    <button id="viewProfileBtn">View Profile</button>
    <button id="dailyTrainingBtn">Antrenamente Zilnice</button>
    <button id="viewChallengesBtn">Provocări</button>
    <button id="viewLeaderboardsBtn">Clasamente</button> <!-- NEW BUTTON -->
</div>

<div class="game-area">
    <div id="gameInfo" class="game-info">
        <span id="playerChips">Your Chips: $1000</span>
        <span id="pot">Pot: $0</span>
        <span id="playerLevelXP">Level: 1 (0/100 XP)</span> <!-- New element for Level and XP -->
    </div>

    <div class="player-hand">
        <h3>Your Hand</h3>
        <div class="cards-container" id="playerHandCards">
            <div class="card-placeholder"></div>
            <div class="card-placeholder"></div>
        </div>
    </div>

    <div class="community-cards">
        <h3>Community Cards</h3>
        <div class="cards-container" id="communityCards">
            <!-- Placeholders for community cards will be filled by JS -->
        </div>
    </div>

    <div class="controls">
        <button id="dealBtn">Deal Flop</button>
        <button id="foldBtn">Fold</button>
        <button id="checkBtn">Check</button>
        <button id="callBtn" style="display: none;">Call</button>
        <button id="raiseBtn" style="display: none;">Raise</button>
        <button id="resetBtn" style="display: none;">Reset Game</button>
    </div>

    <div id="bettingControls" class="betting-controls" style="display: none;">
        <input type="number" id="betAmount" min="1" value="0">
        <button id="placeBetBtn">Bet</button>
    </div>

</div>

<div id="profileArea" class="profile-area">
    <h2>Player Profile</h2>
    <p>Level: <span id="profileLevel">1</span></p>
    <p>Current XP: <span id="profileXP">0</span></p>
    <p>XP to next Level: <span id="profileNextLevelXP">100</span></p>
    <button id="backToGameBtn">Back to Main Menu</button>
</div>

<div id="dailyTrainingArea" class="daily-training-area">
    <h2>Antrenamente Zilnice</h2>
    <p>Completează antrenamentul zilnic pentru a câștiga 50 XP bonus!</p>
    <button id="startDailyTrainingBtn">Începe Antrenamentul</button>
    <p id="dailyTrainingStatus"></p>
    <button id="backToMainFromDailyTrainingBtn">Înapoi la Meniu</button>
</div>

<div id="challengesArea" class="challenges-area">
    <h2>Provocări</h2>
    <ul id="challengesList">
        <!-- Challenges will be dynamically loaded here by JS -->
    </ul>
    <button id="backToMainFromChallengesBtn">Înapoi la Meniu</button>
</div>

<div id="leaderboardsArea" class="leaderboards-area"> <!-- NEW LEADERBOARDS AREA -->
    <h2>Clasamente</h2>
    <ul id="leaderboardList">
        <!-- Leaderboard items will be dynamically loaded here by JS -->
    </ul>
    <button id="backToMainFromLeaderboardsBtn">Înapoi la Meniu</button>
</div>

<script>
    const startTrainingBtn = document.getElementById('startTrainingBtn');
    const viewProfileBtn = document.getElementById('viewProfileBtn');
    const dailyTrainingBtn = document.getElementById('dailyTrainingBtn');
    const viewChallengesBtn = document.getElementById('viewChallengesBtn');
    const viewLeaderboardsBtn = document.getElementById('viewLeaderboardsBtn'); // NEW

    const backToGameBtn = document.getElementById('backToGameBtn');
    const startDailyTrainingBtn = document.getElementById('startDailyTrainingBtn');
    const dailyTrainingStatus = document.getElementById('dailyTrainingStatus');
    const backToMainFromDailyTrainingBtn = document.getElementById('backToMainFromDailyTrainingBtn');
    const backToMainFromChallengesBtn = document.getElementById('backToMainFromChallengesBtn');
    const backToMainFromLeaderboardsBtn = document.getElementById('backToMainFromLeaderboardsBtn'); // NEW

    const mainControls = document.querySelector('.main-controls');
    const gameArea = document.querySelector('.game-area');
    const profileArea = document.getElementById('profileArea');
    const dailyTrainingArea = document.getElementById('dailyTrainingArea');
    const challengesArea = document.getElementById('challengesArea');
    const leaderboardsArea = document.getElementById('leaderboardsArea'); // NEW
    const leaderboardList = document.getElementById('leaderboardList'); // NEW
    const challengesList = document.getElementById('challengesList');

    const playerChipsSpan = document.getElementById('playerChips');
    const potSpan = document.getElementById('pot');
    const playerLevelXPSpan = document.getElementById('playerLevelXP');
    const profileLevel = document.getElementById('profileLevel');
    const profileXP = document.getElementById('profileXP');
    const profileNextLevelXP = document.getElementById('profileNextLevelXP');

    const playerHandCardsDiv = document.getElementById('playerHandCards');
    const communityCardsDiv = document.getElementById('communityCards');
    const dealBtn = document.getElementById('dealBtn');
    const foldBtn = document.getElementById('foldBtn');
    const checkBtn = document.getElementById('checkBtn');
    const callBtn = document.getElementById('callBtn');
    const raiseBtn = document.getElementById('raiseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const bettingControlsDiv = document.getElementById('bettingControls');
    const betAmountInput = document.getElementById('betAmount');
    const placeBetBtn = document.getElementById('placeBetBtn');


    const suits = ['♠', '♥', '♦', '♣'];
    const ranks = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
    let deck = [];
    let playerHand = [];
    let communityCards = [];
    let gameStage = 0; // 0: pre-flop, 1: flop, 2: turn, 3: river
    let playerChips = 1000;
    let currentPot = 0;
    let currentBet = 0; // The amount to call
    let lastBetAmount = 0; // The actual amount of the last bet/raise

    let playerXP = parseInt(localStorage.getItem('pokerMentorXP')) || 0; // Load XP from localStorage
    let playerLevel = parseInt(localStorage.getItem('pokerMentorLevel')) || 1; // Load Level from localStorage
    let lastDailyTrainingDate = localStorage.getItem('pokerMentorLastDailyTrainingDate') || null;

    const challenges = [
        {
            id: 'play5Hands',
            name: 'Joacă 5 Mâini',
            description: 'Termină 5 mâini de poker.',
            rewardXP: 25,
            rewardChips: 50,
            condition: { type: 'handsPlayed', target: 5 },
            currentProgress: 0
        },
        {
            id: 'make3Bets',
            name: 'Fă 3 Pariuri',
            description: 'Fă cel puțin 3 pariuri sau raise-uri într-un singur joc sau de-a lungul mai multor jocuri.',
            rewardXP: 15,
            rewardChips: 30,
            condition: { type: 'betsMade', target: 3 },
            currentProgress: 0
        },
        {
            id: 'reachLevel2',
            name: 'Atinge Nivelul 2',
            description: 'Atinge nivelul 2 al antrenorului de poker.',
            rewardXP: 50,
            rewardChips: 100,
            condition: { type: 'playerLevel', target: 2 },
            currentProgress: 0 // This will be checked against playerLevel
        }
    ];

    let challengesProgress = JSON.parse(localStorage.getItem('pokerMentorChallengesProgress')) || {};

    // Initialize challenges progress if not already present
    challenges.forEach(challenge => {
        if (!challengesProgress[challenge.id]) {
            challengesProgress[challenge.id] = { completed: false, claimed: false, currentProgress: 0 };
        }
    });

    // NEW: Leaderboard data and progress
    let bestLevel = parseInt(localStorage.getItem('pokerMentorBestLevel')) || 1;
    let bestXP = parseInt(localStorage.getItem('pokerMentorBestXP')) || 0;
    let bestChips = parseInt(localStorage.getItem('pokerMentorBestChips')) || 1000;

    function xpForNextLevel(level) {
        return level * 100; // Simple curve: Level 1 -> 100 XP, Level 2 -> 200 XP, etc.
    }

    function saveProgress() {
        localStorage.setItem('pokerMentorXP', playerXP);
        localStorage.setItem('pokerMentorLevel', playerLevel);
        localStorage.setItem('pokerMentorLastDailyTrainingDate', lastDailyTrainingDate);
        localStorage.setItem('pokerMentorChallengesProgress', JSON.stringify(challengesProgress));
        // NEW: Save leaderboard progress
        localStorage.setItem('pokerMentorBestLevel', bestLevel);
        localStorage.setItem('pokerMentorBestXP', bestXP);
        localStorage.setItem('pokerMentorBestChips', bestChips);
    }

    function gainXP(amount) {
        playerXP += amount;
        let leveledUp = false;
        while (playerXP >= xpForNextLevel(playerLevel)) {
            playerXP -= xpForNextLevel(playerLevel);
            playerLevel++;
            leveledUp = true;
            alert(`Congratulations! You reached Level ${playerLevel}!`);
        }
        if (leveledUp) {
            playerChips += playerLevel * 100; 
            alert(`You also received ${playerLevel * 100} chips as a reward!`);
        }
        updateLeaderboardStats(); // NEW: Update leaderboard stats after gaining XP/level
        saveProgress();
        updateGameInfo(); 
        checkChallengeCompletion(); 
    }

    function createDeck() {
        deck = [];
        for (const suit of suits) {
            for (const rank of ranks) {
                deck.push({ rank, suit });
            }
        }
    }

    function shuffleDeck() {
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]]; // Swap
        }
    }

    function drawCard() {
        return deck.pop();
    }

    function displayCard(card, element) {
        if (!card) {
            element.innerHTML = '';
            element.className = 'card-placeholder'; // Reset class
            element.style.backgroundColor = '#333';
            return;
        }
        element.className = 'card-placeholder actual-card'; // Add actual-card class
        element.innerHTML = `<div class="rank">${card.rank}</div><div class="suit">${card.suit}</div>`;
        if (card.suit === '♥' || card.suit === '♦') {
            element.classList.add('red');
        } else {
            element.classList.remove('red');
        }
        element.style.backgroundColor = 'white'; // Darker background for actual cards
        element.style.color = 'black';
    }

    function updateProfileInfo() {
        profileLevel.textContent = playerLevel;
        profileXP.textContent = playerXP;
        profileNextLevelXP.textContent = xpForNextLevel(playerLevel);
    }

    function updateGameInfo() {
        playerChipsSpan.textContent = `Your Chips: $${playerChips}`;
        potSpan.textContent = `Pot: $${currentPot}`;
        const xpNeeded = xpForNextLevel(playerLevel);
        playerLevelXPSpan.textContent = `Level: ${playerLevel} (${playerXP}/${xpNeeded} XP)`;
        updateProfileInfo(); 
        updateDailyTrainingStatus();
        updateLeaderboardStats(); // NEW: Update leaderboard stats when game info updates
    }

    function showSection(sectionId) {
        gameArea.style.display = 'none';
        profileArea.style.display = 'none';
        dailyTrainingArea.style.display = 'none';
        challengesArea.style.display = 'none';
        leaderboardsArea.style.display = 'none'; // NEW
        mainControls.style.display = 'none'; 

        document.getElementById(sectionId).style.display = 'flex';

        if (sectionId === 'mainControls') {
            mainControls.style.display = 'flex';
        } else if (sectionId === 'gameArea') {
            gameArea.style.display = 'flex';
        } else if (sectionId === 'profileArea') {
            profileArea.style.display = 'flex'; 
        } else if (sectionId === 'dailyTrainingArea') {
            dailyTrainingArea.style.display = 'flex';
            updateDailyTrainingStatus();
        } else if (sectionId === 'challengesArea') {
            challengesArea.style.display = 'flex';
            updateChallengesDisplay(); 
        } else if (sectionId === 'leaderboardsArea') { // NEW
            leaderboardsArea.style.display = 'flex';
            updateLeaderboardsDisplay(); // Update leaderboards when showing the area
        }
    }

    function isToday(someDate) {
        const today = new Date();
        const date = new Date(someDate);
        return date.getDate() === today.getDate() &&
               date.getMonth() === today.getMonth() &&
               date.getFullYear() === today.getFullYear();
    }

    function updateDailyTrainingStatus() {
        if (lastDailyTrainingDate && isToday(lastDailyTrainingDate)) {
            dailyTrainingStatus.textContent = 'Antrenament zilnic completat pentru astăzi!';
            startDailyTrainingBtn.disabled = true;
            startDailyTrainingBtn.style.backgroundColor = '#555';
        } else {
            dailyTrainingStatus.textContent = 'Antrenament zilnic disponibil!';
            startDailyTrainingBtn.disabled = false;
            startDailyTrainingBtn.style.backgroundColor = '#f1c40f';
        }
    }

    function checkChallengeCompletion() {
        challenges.forEach(challenge => {
            const progress = challengesProgress[challenge.id];
            if (progress.completed || progress.claimed) return; 

            let isCompleted = false;
            switch (challenge.condition.type) {
                case 'handsPlayed':
                    isCompleted = (progress.currentProgress >= challenge.condition.target);
                    break;
                case 'betsMade':
                    isCompleted = (progress.currentProgress >= challenge.condition.target);
                    break;
                case 'playerLevel':
                    isCompleted = (playerLevel >= challenge.condition.target);
                    break;
            }

            if (isCompleted) {
                progress.completed = true;
                alert(`Provocare completată: ${challenge.name}! Revendică recompensa!`);
                saveProgress();
                updateChallengesDisplay();
            }
        });
    }

    function updateChallengesDisplay() {
        challengesList.innerHTML = ''; 
        challenges.forEach(challenge => {
            const progress = challengesProgress[challenge.id];
            const listItem = document.createElement('li');
            listItem.classList.add('challenge-item');

            let statusText = '';
            let buttonHtml = '';

            if (progress.claimed) {
                statusText = 'Revendicată';
                buttonHtml = '<button disabled style="background:#555;">Revendicată</button>';
            } else if (progress.completed) {
                statusText = 'Gata de Revendicat';
                buttonHtml = `<button data-challenge-id="${challenge.id}" class="claim-reward-btn">Revendică ${challenge.rewardXP} XP / $${challenge.rewardChips}</button>`;
            } else {
                let current = progress.currentProgress || 0;
                let target = challenge.condition.target;
                if (challenge.condition.type === 'playerLevel') {
                    current = playerLevel;
                    target = challenge.condition.target;
                }
                statusText = `Progres: ${current}/${target}`;
                buttonHtml = '<button disabled style="background:#555;">În Progres</button>';
            }

            listItem.innerHTML = `
                <div class="challenge-item-details">
                    <h4>${challenge.name}</h4>
                    <p>${challenge.description}</p>
                    <p class="status">Status: ${statusText}</p>
                </div>
                <div class="reward-claim">
                    ${buttonHtml}
                </div>
            `;
            challengesList.appendChild(listItem);
        });

        document.querySelectorAll('.claim-reward-btn').forEach(button => {
            button.addEventListener('click', (event) => {
                const challengeId = event.target.dataset.challengeId;
                claimChallenge(challengeId);
            });
        });
    }

    function claimChallenge(challengeId) {
        const challenge = challenges.find(c => c.id === challengeId);
        const progress = challengesProgress[challengeId];

        if (challenge && progress && progress.completed && !progress.claimed) {
            gainXP(challenge.rewardXP);
            playerChips += challenge.rewardChips;
            progress.claimed = true;
            alert(`Ai revendicat ${challenge.rewardXP} XP și $${challenge.rewardChips} pentru provocarea: ${challenge.name}!`);
            saveProgress();
            updateGameInfo();
            updateChallengesDisplay();
        } else if (!progress.completed) {
            alert("Provocarea nu este încă finalizată!");
        } else if (progress.claimed) {
            alert("Recompensa pentru această provocare a fost deja revendicată!");
        }
    }

    function updateLeaderboardStats() {
        if (playerLevel > bestLevel) {
            bestLevel = playerLevel;
        }
        if (playerXP > bestXP) {
            bestXP = playerXP;
        }
        if (playerChips > bestChips) {
            bestChips = playerChips;
        }
        saveProgress();
    }

    function updateLeaderboardsDisplay() {
        leaderboardList.innerHTML = ''; // Clear existing list

        const entries = [
            { name: 'You (Level)', value: bestLevel, unit: 'Level' },
            { name: 'You (XP)', value: bestXP, unit: 'XP' },
            { name: 'You (Chips)', value: bestChips, unit: 'Chips' },
            { name: 'AI Pro', value: 10, unit: 'Level', type: 'dummy' },
            { name: 'AI Veteran', value: 500, unit: 'XP', type: 'dummy' },
            { name: 'AI Tycoon', value: 5000, unit: 'Chips', type: 'dummy' }
        ];

        // Sort entries (e.g., by level, then XP, then chips)
        entries.sort((a, b) => {
            if (a.unit === 'Level' && b.unit === 'Level') return b.value - a.value;
            if (a.unit === 'XP' && b.unit === 'XP') return b.value - a.value;
            if (a.unit === 'Chips' && b.unit === 'Chips') return b.value - a.value;
            return 0;
        });

        entries.forEach(entry => {
            const listItem = document.createElement('li');
            listItem.classList.add('leaderboard-item');
            listItem.innerHTML = `<span>${entry.name}</span><span>${entry.value} ${entry.unit}</span>`;
            leaderboardList.appendChild(listItem);
        });
    }


    function resetGame() {
        playerHand = [];
        communityCards = [];
        gameStage = 0;
        currentPot = 0;
        currentBet = 0;
        lastBetAmount = 0;
        betAmountInput.value = 0;
        playerHandCardsDiv.innerHTML = '<div class="card-placeholder"></div><div class="card-placeholder"></div>';
        communityCardsDiv.innerHTML = '';
        dealBtn.textContent = 'Deal Flop';
        dealBtn.style.display = 'inline-block';
        foldBtn.style.display = 'inline-block';
        checkBtn.style.display = 'inline-block';
        callBtn.style.display = 'none';
        raiseBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        bettingControlsDiv.style.display = 'none';
        gameArea.style.display = 'none';
        updateGameInfo();
        saveProgress();
        // Reset challenge specific progress that's not tied to game events
        challenges.forEach(challenge => {
             if (challenge.condition.type !== 'handsPlayed' && challenge.condition.type !== 'betsMade') {
                 challengesProgress[challenge.id].currentProgress = 0;
                 challengesProgress[challenge.id].completed = false;
                 challengesProgress[challenge.id].claimed = false;
             }
        });
        saveProgress();
        checkChallengeCompletion();
        showSection('mainControls'); 
    }

    function dealInitialCards() {
        createDeck();
        shuffleDeck();

        playerHand = [drawCard(), drawCard()];
        const playerCards = playerHandCardsDiv.querySelectorAll('.card-placeholder');
        displayCard(playerHand[0], playerCards[0]);
        displayCard(playerHand[1], playerCards[1]);

        dealBtn.textContent = 'Deal Flop';
        bettingRoundStart();
        gainXP(10); 
        challengesProgress['play5Hands'].currentProgress++;
        saveProgress();
        checkChallengeCompletion();
    }

    function bettingRoundStart() {
        currentBet = 0; 
        lastBetAmount = 0;
        betAmountInput.value = 0;
        bettingControlsDiv.style.display = 'flex';
        dealBtn.style.display = 'none'; 
        checkBtn.style.display = 'inline-block';
        foldBtn.style.display = 'inline-block';
        callBtn.style.display = 'none';
        raiseBtn.style.display = 'none';

        updateBettingActions();
    }

    function updateBettingActions() {
        if (currentBet === 0) {
            checkBtn.style.display = 'inline-block';
            callBtn.style.display = 'none';
            raiseBtn.style.display = 'none';
            placeBetBtn.textContent = 'Bet';
            betAmountInput.min = '1';
            betAmountInput.value = Math.min(10, playerChips); 
        } else {
            checkBtn.style.display = 'none';
            callBtn.style.display = 'inline-block';
            callBtn.textContent = `Call $${currentBet}`;
            raiseBtn.style.display = 'inline-block';
            placeBetBtn.textContent = 'Raise';
            betAmountInput.min = `${currentBet + 1}`;
            betAmountInput.value = Math.min(currentBet + 10, playerChips); 
        }
    }

    function handleBet(amount) {
        if (amount > playerChips) {
            alert("You don't have enough chips!");
            return false;
        }
        if (placeBetBtn.textContent === 'Bet' && amount === 0) {
            alert("You must bet at least 1 chip.");
            return false;
        }
        if (placeBetBtn.textContent === 'Raise' && amount <= currentBet) {
            alert(`You must raise more than the current bet of $${currentBet}.`);
            return false;
        }

        playerChips -= amount;
        currentPot += amount;
        currentBet = amount; 
        lastBetAmount = amount; 
        updateGameInfo();
        bettingControlsDiv.style.display = 'none';
        dealBtn.style.display = 'inline-block';
        gainXP(5); 
        challengesProgress['make3Bets'].currentProgress++;
        saveProgress();
        checkChallengeCompletion();
        return true;
    }

    function handleCall() {
        const amountToCall = currentBet; 
        if (amountToCall > playerChips) {
            alert("You don't have enough chips to call!");
            return false;
        }
        playerChips -= amountToCall;
        currentPot += amountToCall;
        updateGameInfo();
        bettingControlsDiv.style.display = 'none'; 
        dealBtn.style.display = 'inline-block'; 
        gainXP(3); 
        return true;
    }

    function handleCheck() {
        if (currentBet > 0) {
            alert("Cannot check, there's an active bet. You must call, raise, or fold.");
            return false;
        }
        alert("You checked.");
        bettingControlsDiv.style.display = 'none'; 
        dealBtn.style.display = 'inline-block'; 
        gainXP(2); 
        return true;
    }


    function dealNextStage() {
        if (gameStage === 0) { 
            communityCardsDiv.innerHTML = ''; 
            communityCards.push(drawCard(), drawCard(), drawCard());
            for (let i = 0; i < 3; i++) {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card-placeholder');
                communityCardsDiv.appendChild(cardElement);
                displayCard(communityCards[i], cardElement);
            }
            dealBtn.textContent = 'Deal Turn';
            gameStage = 1;
        } else if (gameStage === 1) { 
            communityCards.push(drawCard());
            const cardElement = document.createElement('div');
                cardElement.classList.add('card-placeholder');
            communityCardsDiv.appendChild(cardElement);
            displayCard(communityCards[3], cardElement);
            dealBtn.textContent = 'Deal River';
            gameStage = 2;
        } else if (gameStage === 2) { 
            communityCards.push(drawCard());
            const cardElement = document.createElement('div');
            cardElement.classList.add('card-placeholder');
            communityCardsDiv.appendChild(cardElement);
            displayCard(communityCards[4], cardElement);
            dealBtn.style.display = 'none'; 
            resetBtn.style.display = 'inline-block'; 
            gameStage = 3;
            alert('All cards dealt! Game finished. Implement hand evaluation or Reset Game.');
        } else if (gameStage === 3) {
            alert('Game finished! Click Reset Game to start a new one.');
            return;
        }
        if (gameStage < 3) {
            bettingRoundStart(); 
            gainXP(5); 
        }
    }

    // Event Listeners
    startTrainingBtn.addEventListener('click', () => {
        showSection('gameArea');
        resetGame(); 
        dealInitialCards();
        updateGameInfo(); 
    });

    viewProfileBtn.addEventListener('click', () => {
        showSection('profileArea');
        updateProfileInfo(); 
    });

    dailyTrainingBtn.addEventListener('click', () => {
        showSection('dailyTrainingArea');
    });

    viewChallengesBtn.addEventListener('click', () => {
        showSection('challengesArea');
        updateChallengesDisplay(); 
    });

    viewLeaderboardsBtn.addEventListener('click', () => { // NEW
        showSection('leaderboardsArea');
        updateLeaderboardsDisplay();
    });

    backToGameBtn.addEventListener('click', () => {
        showSection('mainControls'); 
    });

    backToMainFromDailyTrainingBtn.addEventListener('click', () => {
        showSection('mainControls');
    });

    backToMainFromChallengesBtn.addEventListener('click', () => {
        showSection('mainControls');
    });

    backToMainFromLeaderboardsBtn.addEventListener('click', () => { // NEW
        showSection('mainControls');
    });

    startDailyTrainingBtn.addEventListener('click', () => {
        if (!lastDailyTrainingDate || !isToday(lastDailyTrainingDate)) {
            gainXP(50); 
            lastDailyTrainingDate = new Date().toDateString(); 
            saveProgress();
            updateDailyTrainingStatus();
            alert("Ai completat antrenamentul zilnic și ai primit 50 XP bonus!");
        } else {
            alert("Ai completat deja antrenamentul zilnic pentru astăzi. Revino mâine!");
        }
    });

    dealBtn.addEventListener('click', dealNextStage);
    resetBtn.addEventListener('click', resetGame);

    foldBtn.addEventListener('click', () => {
        alert('You folded! Game reset.');
        gainXP(1); 
        resetGame();
    });

    checkBtn.addEventListener('click', handleCheck);
    callBtn.addEventListener('click', handleCall);
    raiseBtn.addEventListener('click', () => {
        bettingControlsDiv.style.display = 'flex';
        betAmountInput.min = `${currentBet + 1}`;
        betAmountInput.value = Math.max(currentBet + 1, lastBetAmount + 10, playerChips); 
        placeBetBtn.textContent = 'Raise';
        checkBtn.style.display = 'none';
        callBtn.style.display = 'none';
        foldBtn.style.display = 'none';
        dealBtn.style.display = 'none';
    });

    placeBetBtn.addEventListener('click', () => {
        const amount = parseInt(betAmountInput.value);
        if (isNaN(amount) || amount < parseInt(betAmountInput.min)) {
            alert(`Please enter a valid amount, at least ${betAmountInput.min}.`);
            return;
        }
        if (handleBet(amount)) {
            bettingControlsDiv.style.display = 'none';
            dealBtn.style.display = 'inline-block';
            checkBtn.style.display = 'inline-block'; 
            foldBtn.style.display = 'inline-block';
            callBtn.style.display = 'none';
            raiseBtn.style.display = 'none';
        }
    });

    // Initial setup
    updateGameInfo();
    showSection('mainControls'); 

</script>
